{{ define "content" }}
<div class="space-y-6">

    <div>
        <h2 class="text-base font-bold text-slate-900">Panel & Server Core Settings</h2>
        <p class="text-xs text-slate-500 mt-0.5">Configure host binding, security headers, system services, and defaults</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Settings Form -->
        <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6">
            <h3 class="text-sm font-bold text-slate-900 mb-4 pb-3 border-b border-slate-100">Networking & Security Configuration</h3>
            <form action="/settings/save" method="POST" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Panel Access Hostname</label>
                        <input type="text" name="hostname" value="{{ .Settings.Hostname }}" class="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Panel HTTPS Port</label>
                        <input type="number" name="port" value="{{ .Settings.Port }}" class="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none font-mono">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Default Web Server Engine</label>
                        <select name="default_webserver" class="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                            <option value="nginx" {{ if eq .Settings.DefaultWebServer "nginx" }}selected{{ end }}>Nginx</option>
                            <option value="apache2" {{ if eq .Settings.DefaultWebServer "apache2" }}selected{{ end }}>Apache2</option>
                            <option value="openlitespeed" {{ if eq .Settings.DefaultWebServer "openlitespeed" }}selected{{ end }}>OpenLiteSpeed</option>
                            <option value="caddy" {{ if eq .Settings.DefaultWebServer "caddy" }}selected{{ end }}>Caddy</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Default PHP Version</label>
                        <select name="default_php_version" class="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                            <option value="8.4" {{ if eq .Settings.DefaultPHPVersion "8.4" }}selected{{ end }}>PHP 8.4</option>
                            <option value="8.3" {{ if eq .Settings.DefaultPHPVersion "8.3" }}selected{{ end }}>PHP 8.3</option>
                            <option value="8.2" {{ if eq .Settings.DefaultPHPVersion "8.2" }}selected{{ end }}>PHP 8.2</option>
                            <option value="8.1" {{ if eq .Settings.DefaultPHPVersion "8.1" }}selected{{ end }}>PHP 8.1</option>
                            <option value="7.4" {{ if eq .Settings.DefaultPHPVersion "7.4" }}selected{{ end }}>PHP 7.4</option>
                        </select>
                    </div>
                </div>

                <div class="pt-2">
                    <label class="flex items-center">
                        <input type="checkbox" name="security_headers" value="true" {{ if .Settings.SecurityHeadersEnabled }}checked{{ end }} class="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500">
                        <span class="ml-2 text-xs font-medium text-slate-700">Enforce strict HTTP security headers (HSTS, nosniff, SAMEORIGIN, CSP)</span>
                    </label>
                </div>

                <div class="pt-4 border-t border-slate-100 flex justify-end">
                    <button type="submit" class="px-5 py-2.5 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-sm transition-colors">
                        Save Configuration
                    </button>
                </div>
            </form>
        </div>

        <!-- Service Controller Card -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6">
            <h3 class="text-sm font-bold text-slate-900 mb-4 pb-3 border-b border-slate-100">Service Controller</h3>
            <div class="space-y-3">
                {{ range .Services }}
                <div class="p-3 bg-slate-50 border border-slate-200/60 rounded-xl flex items-center justify-between">
                    <div>
                        <span class="text-xs font-bold font-mono text-slate-800">{{ .Name }}</span>
                        <span class="block text-[10px] {{ if .Active }}text-emerald-600{{ else }}text-slate-400{{ end }}">{{ if .Active }}Active & Running{{ else }}Stopped{{ end }}</span>
                    </div>
                    <div class="flex space-x-1.5">
                        <form action="/services/restart" method="POST" class="inline">
                            <input type="hidden" name="service" value="{{ .Name }}">
                            <button type="submit" class="px-2 py-1 text-[11px] font-semibold text-slate-700 bg-white border border-slate-200 rounded-lg hover:bg-slate-100 transition-colors">Restart</button>
                        </form>
                    </div>
                </div>
                {{ end }}
            </div>
        </div>
    </div>

</div>
{{ end }}
